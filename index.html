<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job16 | Primul tău job începe aici</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Montserrat', sans-serif;
}

body {
    background: radial-gradient(circle at top, #1a1a1a, #0a0a0a 60%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
}

/* subtle animated background glow */
body::before {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
    animation: pulse 6s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(1); opacity: 0.5; }
    to { transform: scale(1.2); opacity: 0.8; }
}

.container {
    max-width: 750px;
    padding: 20px;
    position: relative;
    z-index: 2;
    animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.logo {
    width: 200px;
    margin-bottom: 25px;
    animation: float 4s ease-in-out infinite;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

h1 {
    font-size: 3.2rem;
    font-weight: 800;
    background: linear-gradient(90deg, #d9d9d9, #ffffff, #bfbfbf);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 15px;
}

p {
    font-size: 1.1rem;
    color: #bfbfbf;
    line-height: 1.7;
    margin-bottom: 35px;
}

.button {
    display: inline-block;
    padding: 16px 45px;
    font-size: 1rem;
    font-weight: 600;
    color: #0a0a0a;
    background: linear-gradient(90deg, #ffffff, #d6d6d6);
    border-radius: 50px;
    text-decoration: none;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.button:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 25px rgba(255,255,255,0.5);
}

.button::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
    top: 0;
    left: -100%;
    transition: 0.6s;
}

.button:hover::after {
    left: 100%;
}

footer {
    position: absolute;
    bottom: 20px;
    font-size: 0.8rem;
    color: #666;
}
</style>
</head>

<body>

<div class="container">

    <img src="https://i.ibb.co/SDCgzM3r/52-BA2435-1-BAD-4-D65-8472-49-CD35907-B78.png" class="logo" alt="Job16 Logo">

    <h1>Job16</h1>

    <p>
        Prima comunitate din România dedicată tinerilor de 16–18 ani care își caută primul job.
        Oportunități reale, suport pentru CV și acces la angajatori care acceptă minori.
    </p>

    <!-- INLOCUIESTE CU LINKUL TAU REAL DE DISCORD -->
    <a href="https://buy.stripe.com/3cI9AM2lZc4RcJW4Q408g00" class="button" target="_blank">
        Intră pe server
    </a>

</div>

<footer>
    © 2026 Job16 România
</footer>

</body>
</html>
